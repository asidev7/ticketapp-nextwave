{% load l10n %}{% localize off %}<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One page per ticket, at the printed ticket size. The page is the ticket image (lossless PNG). */
  @page { size: {{ width_mm }}mm {{ height_mm }}mm; margin: 0; }
  body { margin: 0; }
  img { display: block; width: {{ width_mm }}mm; height: {{ height_mm }}mm; page-break-after: always; }
  img:last-child { page-break-after: auto; }
</style>
</head>
<body>
{% for uri in pages %}<img src="{{ uri }}" alt="">{% endfor %}
</body>
</html>{% endlocalize %}
