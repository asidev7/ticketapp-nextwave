{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A3D91">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="{% url 'scanner:manifest' %}">
  <link rel="icon" type="image/png" href="{% static 'img/icon-192.png' %}">
  <title>{% translate "Scanner login" %} · NextWave</title>
  <link rel="stylesheet" href="{% static 'css/scanner.css' %}">
</head>
<body class="login">
  <main class="login__card">
    <img src="{% static 'img/icon-192.png' %}" alt="" width="72" height="72">
    <h1>{% translate "Entrance scanner" %}</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<p class="login__error" role="alert">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</p>{% endif %}
      <label for="id_username">{% translate "E-mail" %}</label>
      <input type="email" name="username" id="id_username" required autofocus autocomplete="email" inputmode="email" value="{{ form.username.value|default_if_none:'' }}">
      <label for="id_password">{% translate "Password" %}</label>
      <input type="password" name="password" id="id_password" required autocomplete="current-password">
      <button type="submit" class="btn btn-block">{% translate "Log in" %}</button>
    </form>
  </main>
</body>
</html>
