# /etc/nginx/sites-available/nextwave  (enabled via sites-enabled/nextwave)
# NextWave Party: Docker stack in /opt/nextwave, web container on 127.0.0.1:8460
# Canonical address: https://ticket.j5group.bar
# nextwave.j5group.bar, j5group.bar and www.j5group.bar redirect to it.

upstream nextwave_app {
    server 127.0.0.1:8460;
    keepalive 16;
}

# HTTP: certificate challenges, everything else goes to the canonical HTTPS host
server {
    listen 80;
    listen [::]:80;
    server_name ticket.j5group.bar nextwave.j5group.bar j5group.bar www.j5group.bar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ticket.j5group.bar$request_uri;
    }
}

# nextwave.j5group.bar -> ticket.j5group.bar
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nextwave.j5group.bar;

    ssl_certificate /etc/letsencrypt/live/ticket.j5group.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket.j5group.bar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ticket.j5group.bar$request_uri;
}

# j5group.bar and www -> ticket.j5group.bar
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name j5group.bar www.j5group.bar;

    ssl_certificate /etc/letsencrypt/live/j5group.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j5group.bar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ticket.j5group.bar$request_uri;
}

# The site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ticket.j5group.bar;

    ssl_certificate /etc/letsencrypt/live/ticket.j5group.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket.j5group.bar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Holder photos are uploaded at checkout (max 5 MB each)
    client_max_body_size 30M;

    # Public media only. Tickets and holder photos live in data/private_media
    # and are served by Django behind signed links.
    location /media/ {
        alias /opt/nextwave/data/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://nextwave_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
