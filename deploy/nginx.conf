# /etc/nginx/sites-available/nextwave  (then: ln -s ../sites-available/nextwave /etc/nginx/sites-enabled/)
# TLS certificates: sudo certbot --nginx -d nextwaveparty.com -d www.nextwaveparty.com

upstream nextwave_app {
    server 127.0.0.1:8000;   # Gunicorn
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nextwaveparty.com www.nextwaveparty.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nextwaveparty.com www.nextwaveparty.com;

    ssl_certificate     /etc/letsencrypt/live/nextwaveparty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextwaveparty.com/privkey.pem;

    # Holder photos are uploaded at checkout (max 5 MB each)
    client_max_body_size 30M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Public media (event images, artists…). Private files are NOT served here.
    location /media/ {
        alias /srv/nextwave/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static files (also served by WhiteNoise if this block is removed)
    location /static/ {
        alias /srv/nextwave/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://nextwave_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
